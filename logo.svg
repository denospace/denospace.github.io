<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Denospace</title>
  <!--
    Denote's name grammar, drawn. A note's metadata lives in its file name,
    in a fixed order: the identifier, then the title, then the keywords.
    Three rules of descending authority say that, and read as lines of text
    at any size. Ivory and ink, the palette of the Tufte view.
  -->
  <rect width="512" height="512" fill="#1b1b19"/>
  <rect x="104" y="148" width="138" height="44" rx="22" fill="#b4472e"/>
  <rect x="104" y="234" width="304" height="44" rx="22" fill="#fffff8"/>
  <rect x="104" y="320" width="208" height="44" rx="22" fill="#fffff8" opacity="0.55"/>
</svg>
